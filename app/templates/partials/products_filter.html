{#
  Фильтр списка товаров — тот же кусок, что и сам список. В окне выбора он
  спрашивает не адрес страницы, а эндпоинт этой же разметки: `form_action`.
  Без скрипта форма уведёт на страницу товаров, то есть окно просто не
  работает, а страница остаётся рабочей — честный запасной путь.
#}
<form {% if live_filter %}data-live-filter {% endif %}method="get" action="{{ form_action }}" class="flex flex-wrap items-end gap-2 mb-4">
    <input type="hidden" name="sort" value="{{ sort or '' }}">
    <input type="hidden" name="dir" value="{{ direction or '' }}">
    <div>
        <label class="block text-sm">Поиск (название/артикул)</label>
        <input name="search" value="{{ search }}" class="border p-2">
    </div>
    <div>
        <label class="block text-sm">Категория</label>
        <select name="category_id" class="border p-2">
            <option value="">Все</option>
            {% for root in tree %}
                <option value="{{ root.id }}" {% if category_id == root.id %}selected{% endif %}>{{ root.name }}</option>
                {% for child in root.children %}
                    <option value="{{ child.id }}" {% if category_id == child.id %}selected{% endif %}>&nbsp;&nbsp;{{ child.name }}</option>
                {% endfor %}
            {% endfor %}
        </select>
    </div>
    <label class="flex items-center gap-1 text-sm">
        <input type="checkbox" name="include_deleted" value="1" {% if include_deleted %}checked{% endif %}>
        Показывать удалённые
    </label>
    <button class="app-btn-line bg-line px-3 py-2">Фильтр</button>
    <a href="{{ form_action }}" class="app-link text-sm text-accent py-2">Сбросить</a>
</form>
