{#
  Фильтр списка клиентов — тот же кусок, что и сам список. В окне выбора он
  спрашивает эндпоинт этой же разметки (`form_action`), и без скрипта форма
  уводит на страницу клиентов: окно не работает, страница работает.
#}
<form {% if live_filter %}data-live-filter {% endif %}method="get" action="{{ form_action }}" class="flex flex-wrap items-end gap-2 mb-4">
    <input type="hidden" name="sort" value="{{ sort or '' }}">
    <input type="hidden" name="dir" value="{{ direction or '' }}">
    <div>
        <label class="block text-sm">Поиск (имя/телефон/ИНН)</label>
        <input name="search" value="{{ search }}" class="border p-2">
    </div>
    <label class="flex items-center gap-1 text-sm">
        <input type="checkbox" name="include_deleted" value="1" {% if include_deleted %}checked{% endif %}>
        Показывать удалённые
    </label>
    <button class="app-btn-line bg-line px-3 py-2">Фильтр</button>
    <a href="{{ form_action }}" class="app-link text-sm text-accent py-2">Сбросить</a>
</form>
