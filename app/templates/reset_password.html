{% extends "base.html" %}
{% block content %}
<main class="max-w-sm mx-auto mt-16 p-4">
  <h1 class="text-2xl font-bold mb-6">Новый пароль</h1>
  <form id="reset-form" class="space-y-4">
    <input type="hidden" name="token" value="{{ token }}">
    <div>
      <label class="block mb-1">Новый пароль (мин. 8 символов)</label>
      <input name="new_password" type="password" minlength="8" required class="w-full border p-2">
    </div>
    <p id="error" class="text-danger hidden">Ошибка. Попробуйте ещё раз.</p>
    <button class="app-btn-accent w-full bg-accent text-on-accent p-2">Сохранить</button>
  </form>
  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token: f.token.value, new_password: f.new_password.value}),
      });
      if (res.ok) { window.location.href = '/login'; }
      else {
        const d = await res.json().catch(() => ({}));
        const err = document.getElementById('error');
        err.textContent = d.detail || 'Ошибка. Попробуйте ещё раз.';
        err.classList.remove('hidden');
      }
    });
  </script>
</main>
{% endblock %}
