{% extends "base.html" %}
{% block content %}
<main class="max-w-2xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">{% if is_new %}Новый товар{% else %}Редактирование товара {{ product.name }}{% endif %}</h1>
    <form id="product-form" class="space-y-4">
        <div>
            <label class="block mb-1">Название</label>
            <input name="name" required value="{{ product.name if product else '' }}" class="w-full border p-2" {% if not can_edit %}disabled{% endif %}>
        </div>
        <div>
            <label class="block mb-1">Артикул</label>
            <input name="sku" required value="{{ product.sku if product else '' }}" class="w-full border p-2" {% if not can_edit %}disabled{% endif %}>
        </div>
        <div>
            <label class="block mb-1">Категория</label>
            <select name="category_id" class="w-full border p-2" {% if not can_edit %}disabled{% endif %}>
                <option value="">— без категории —</option>
                {% for root in tree %}
                    {% if root.children %}
                    <optgroup label="{{ root.name }}">
                        <option value="{{ root.id }}" {% if product and product.category_id == root.id %}selected{% endif %}>{{ root.name }}</option>
                        {% for child in root.children %}
                            <option value="{{ child.id }}" {% if product and product.category_id == child.id %}selected{% endif %}>{{ child.name }}</option>
                        {% endfor %}
                    </optgroup>
                    {% else %}
                    <option value="{{ root.id }}" {% if product and product.category_id == root.id %}selected{% endif %}>{{ root.name }}</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block mb-1">Единица измерения</label>
            <input name="unit" value="{{ product.unit if product else 'шт' }}" class="w-full border p-2" {% if not can_edit %}disabled{% endif %}>
        </div>
        <div>
            <label class="block mb-1">Цена</label>
            <input name="price" type="number" step="0.01" value="{{ product.price if product else '0' }}" class="w-full border p-2" {% if not can_price %}disabled{% endif %}>
        </div>
        {% if can_stock %}
        <div>
            <label class="block mb-1">Остаток</label>
            <input name="rest" type="number" value="{{ product.rest if product else '0' }}" class="w-full border p-2">
        </div>
        {% endif %}
        <div>
            <label class="block mb-1">Характеристики (JSON)</label>
            <textarea name="characteristic" rows="5" class="w-full border p-2 font-mono text-sm" {% if not can_edit %}disabled{% endif %}>{{ characteristic_json }}</textarea>
        </div>
        <p id="error" class="text-red-600 hidden"></p>
        <button class="bg-blue-600 text-white px-4 py-2">Сохранить</button>
        <a href="{% if product %}/products/{{ product.id }}{% else %}/products{% endif %}" class="ml-2 border px-4 py-2">Отмена</a>
    </form>
    <script>
        var productId = {{ product.id if product else 'null' }};
        var isNew = {{ 'true' if is_new else 'false' }};
        var canEdit = {{ 'true' if can_edit else 'false' }};
        var canPrice = {{ 'true' if can_price else 'false' }};
        var canStock = {{ 'true' if can_stock else 'false' }};

        function showError(text) {
            var err = document.getElementById('error');
            err.textContent = text;
            err.classList.remove('hidden');
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            var f = e.target;
            var body = {};
            if (canEdit) {
                body.name = f.name.value;
                body.sku = f.sku.value;
                body.unit = f.unit.value;
                body.category_id = f.category_id.value ? parseInt(f.category_id.value) : null;
                var raw = f.characteristic.value.trim();
                if (raw) {
                    try { body.characteristic = JSON.parse(raw); }
                    catch (err) { showError('Характеристики: некорректный JSON'); return; }
                } else {
                    body.characteristic = null;
                }
            }
            if (canPrice) { body.price = parseFloat(f.price.value); }
            if (canStock) { body.rest = parseInt(f.rest.value); }

            var url = productId ? '/api/products/' + productId : '/api/products';
            var method = productId ? 'PATCH' : 'POST';
            var res = await fetch(url, {method: method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
            if (res.ok) { window.location.href = '/products'; }
            else {
                var d = await res.json().catch(function () { return {}; });
                showError(d.detail || 'Ошибка');
            }
        });
    </script>
</main>
{% endblock %}
