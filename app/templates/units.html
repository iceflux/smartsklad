{% extends "base.html" %}
{% block content %}
<main class="max-w-4xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Единицы измерения</h1>

    {% if msg %}<p class="mb-4 bg-success-bg border border-success-border p-2">{{ msg }}</p>{% endif %}

    <form method="post" action="/units/new" class="flex items-end gap-2 mb-4">
        <div>
            <label class="block text-sm">Новая единица</label>
            <input name="name" maxlength="32" class="border p-2" required>
        </div>
        <button class="bg-accent text-on-accent px-3 py-2">Добавить</button>
    </form>

    <div class="overflow-x-auto">
    <table class="w-full border-collapse">
        <thead>
            <tr class="border-b text-left">
                <th class="p-2">Название</th>
                <th class="p-2">Изменена</th>
                <th class="p-2">Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for u in units %}
            <tr class="border-b" data-unit-id="{{ u.id }}">
                <td class="p-2">{{ u.name }}</td>
                <td class="p-2">{{ u.updated_at.strftime('%Y-%m-%d %H:%M') if u.updated_at else '—' }}</td>
                <td class="p-2">
                    <form method="post" action="/units/{{ u.id }}/edit" class="inline">
                        <input name="name" value="{{ u.name }}" maxlength="32" class="border p-2">
                        <button class="text-accent">Сохранить</button>
                    </form>
                    <form method="post" action="/units/{{ u.id }}/delete" class="inline" onsubmit="return confirm('Удалить единицу?');">
                        <button class="text-danger">Удалить</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="3" class="p-4 text-center text-muted">Единиц нет</td></tr>
            {% endfor %}
        </tbody>
    </table>
    </div>
</main>
{% endblock %}
