<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="flex items-center justify-between p-4 border-b">
        <a href="/" class="text-xl font-bold">СмартСклад</a>
        <nav>
            {% if user %}
                {% if user.role.is_super or 'users.manage' in (user.role.permissions or []) %}
                    <a href="/roles" class="mr-4">Роли</a>
                    <a href="/users" class="mr-4">Пользователи</a>
                {% endif %}
                <span class="mr-4">{{ user.username }} ({{ user.role.name }})</span>
                <form method="post" action="/logout" class="inline">
                    <button class="border px-3 py-1">Выйти</button>
                </form>
            {% else %}
                <a href="/login" class="border px-3 py-1">Войти</a>
            {% endif %}
        </nav>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
