{% extends "base.html" %}
{% block content %}
<main class="max-w-sm mx-auto mt-16 p-4">
  <h1 class="text-2xl font-bold mb-6">Вход в СмартСклад</h1>
  <form id="login-form" class="space-y-4">
    <div>
      <label class="block mb-1">Логин</label>
      <input name="username" required class="w-full border p-2">
    </div>
    <div>
      <label class="block mb-1">Пароль</label>
      <input name="password" type="password" required class="w-full border p-2">
    </div>
    <p id="error" class="text-danger hidden">Неверный логин или пароль</p>
    <button class="w-full bg-accent text-on-accent p-2">Войти</button>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: f.username.value, password: f.password.value}),
      });
      if (res.ok) { window.location.href = '/'; }
      else {
        const d = await res.json().catch(() => ({}));
        const err = document.getElementById('error');
        err.textContent = d.detail || 'Неверный логин или пароль';
        err.classList.remove('hidden');
      }
    });
  </script>
</main>
{% endblock %}
