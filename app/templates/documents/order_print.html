{% extends "base.html" %}
{% block body_attrs %}data-print-document="true"{% endblock %}
{% block content %}
<main class="max-w-4xl mx-auto p-4">
    <div class="print:hidden mb-4 flex gap-2">
        <button onclick="window.print()" class="app-btn border px-3 py-1">Печать</button>
        <a href="/orders/{{ order_id }}/pdf" class="app-btn border px-3 py-1">Скачать PDF</a>
        {% if can_send_notifications %}
        <form method="post" action="/orders/{{ order_id }}/send" class="inline">
            <input type="hidden" name="channel" value="email">
            <button class="app-btn border px-3 py-1 ml-1">На email</button>
        </form>
        <form method="post" action="/orders/{{ order_id }}/send" class="inline">
            <input type="hidden" name="channel" value="telegram">
            <button class="app-btn border px-3 py-1 ml-1">В Telegram</button>
        </form>
        {% endif %}
    </div>
<div data-print-document-region>
{% include "documents/order_document.html" %}
</div>
</main>
{% endblock %}
